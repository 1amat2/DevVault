<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notes — DevVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
  <link rel="stylesheet" href="../css/responsive.css"/>
  <style>
    .notes-root {
      display: grid;
      grid-template-columns: 190px 270px 1fr;
      height: calc(100vh - 65px);
      overflow: hidden;
    }
    /* Category pane */
    .cat-pane { border-right:1px solid var(--border); padding:var(--gap-md) var(--gap-sm); overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
    .cat-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:7px 10px; border-radius:var(--r-sm); cursor:pointer;
      font-size:.825rem; color:var(--text-muted);
      transition:background .15s, color .15s, padding-left .15s;
    }
    .cat-item:hover  { background:var(--elevated); color:var(--text); padding-left:14px; }
    .cat-item.active { background:var(--primary-dim); color:var(--primary); padding-left:14px; }
    .cat-count { font-size:.7rem; background:var(--elevated2); padding:1px 6px; border-radius:var(--r-full); }

    /* Notes list pane */
    .list-pane { border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
    .list-search { padding:var(--gap-sm) var(--gap-md); border-bottom:1px solid var(--border); }
    .notes-items { flex:1; overflow-y:auto; }
    .note-item {
      padding:var(--gap-md); border-bottom:1px solid var(--border); cursor:pointer;
      transition:background .15s, padding-left .15s, border-left-color .15s;
      border-left:2px solid transparent;
    }
    .note-item:hover  { background:var(--elevated); padding-left:calc(var(--gap-md) + 4px); }
    .note-item.active { background:var(--elevated2); border-left-color:var(--primary); padding-left:calc(var(--gap-md) + 4px); }
    .ni-title   { font-size:.875rem; font-weight:600; color:var(--text); }
    .ni-preview { font-size:.78rem; color:var(--text-muted); margin-top:2px; line-height:1.45; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ni-meta    { display:flex; align-items:center; gap:var(--gap-sm); margin-top:5px; }
    .ni-time    { font-size:.68rem; color:var(--text-faint); }

    /* Editor pane */
    .editor-pane { display:flex; flex-direction:column; overflow:hidden; }
    .editor-head {
      padding:var(--gap-md) var(--gap-lg); border-bottom:1px solid var(--border);
      display:flex; align-items:flex-start; justify-content:space-between; gap:var(--gap-md);
    }
    .editor-toolbar {
      display:flex; align-items:center; gap:2px;
      padding:var(--gap-xs) var(--gap-md); border-bottom:1px solid var(--border);
      flex-wrap:wrap; background:var(--surface);
    }
    .tbtn {
      width:28px; height:28px; display:flex; align-items:center; justify-content:center;
      border-radius:var(--r-sm); font-size:.78rem; font-weight:700; color:var(--text-muted);
      transition:background .12s, color .12s;
    }
    .tbtn:hover { background:var(--elevated2); color:var(--text); }
    .tdivider { width:1px; height:18px; background:var(--border); margin:0 3px; }
    .editor-body { flex:1; display:grid; grid-template-columns:1fr 185px; overflow:hidden; }
    .editor-text-wrap { flex:1; overflow-y:auto; padding:var(--gap-lg); }
    .editor-textarea {
      width:100%; height:100%; min-height:400px; resize:none;
      background:none; border:none; outline:none; color:var(--text);
      font-family:'JetBrains Mono','Fira Code','Courier New',monospace;
      font-size:.84rem; line-height:1.85;
    }
    .info-pane {
      border-left:1px solid var(--border); padding:var(--gap-md);
      overflow-y:auto; display:flex; flex-direction:column; gap:var(--gap-md);
      background:var(--surface);
    }
    .info-row { font-size:.78rem; }
    .info-row .lbl { color:var(--text-faint); font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
    .info-row .val { color:var(--text-muted); }
    .no-note-selected { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text-faint); gap:var(--gap-md); }
    .save-indicator { font-size:.72rem; color:var(--success); opacity:0; transition:opacity .3s; }
    .save-indicator.show { opacity:1; }

    @media(max-width:1100px) { .notes-root { grid-template-columns:170px 240px 1fr; } .editor-body { grid-template-columns:1fr; } .info-pane { display:none; } }
    @media(max-width:768px)  { .notes-root { grid-template-columns:1fr; height:auto; } .cat-pane,.list-pane { border-right:none; border-bottom:1px solid var(--border); height:auto; max-height:40vh; } }
  </style>
</head>

<script type="module">
import { renderSidebar } from '../components/sidebar.js';
import { Notes, timeAgo, formatDate } from '../js/data.js';

renderSidebar('notes');

document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
});
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
});

let activeNote = null;
let activeCategory = 'All Notes';
let searchQuery = '';
let saveTimer = null;

// Populate category select in editor
const CATS = ['JavaScript','TypeScript','Python','C#','SQL','Git','Linux','Supabase','Node.js','APIs','DevOps','Algorithms','General'];
const catSelect = document.getElementById('noteCat');
CATS.forEach(c => catSelect.insertAdjacentHTML('beforeend',`<option value="${c}">${c}</option>`));

// ── Render categories ─────────────────────────────────────────
function renderCats() {
  const pane = document.getElementById('catPane');
  pane.innerHTML = '';
  const cats = Notes.categories();
  const total = Notes.all().length;

  const addItem = (label, cat) => {
    const div = document.createElement('div');
    div.className = 'cat-item' + (cat === activeCategory ? ' active' : '');
    div.innerHTML = `<span>${label}</span><span class="cat-count">${label === 'All Notes' ? total : (cats[cat]||0)}</span>`;
    div.addEventListener('click', () => { activeCategory = cat; renderCats(); renderList(); });
    pane.appendChild(div);
  };
  addItem('All Notes', 'All Notes');
  Object.keys(cats).sort().forEach(c => addItem(c, c));
}

// ── Render note list ──────────────────────────────────────────
function renderList() {
  const listEl = document.getElementById('notesList');
  listEl.innerHTML = '';

  let notes = searchQuery ? Notes.search(searchQuery) : Notes.byCategory(activeCategory);
  notes = [...notes.filter(n=>n.pinned), ...notes.filter(n=>!n.pinned)];

  if (!notes.length) {
    listEl.innerHTML = `<div style="padding:var(--gap-xl);text-align:center;color:var(--text-faint);font-size:.825rem">No notes found</div>`;
    return;
  }
  notes.forEach((n, i) => {
    const div = document.createElement('div');
    div.className = 'note-item' + (activeNote?.id === n.id ? ' active' : '');
    div.style.animationDelay = (i * 0.04) + 's';
    const preview = n.content.replace(/[#*`\-_>]/g,'').split('\n').filter(l=>l.trim()).slice(0,2).join(' ');
    div.innerHTML = `
      <div class="ni-title">${n.pinned ? '📌 ' : ''}${n.title}</div>
      <div class="ni-preview">${preview.substring(0,70)}</div>
      <div class="ni-meta">
        <span class="tag" style="font-size:.62rem">${n.category}</span>
        <span class="ni-time">${timeAgo(n.updatedAt)}</span>
      </div>`;
    div.addEventListener('click', () => openNote(n));
    listEl.appendChild(div);
  });
}

// ── Open note ─────────────────────────────────────────────────
function openNote(n) {
  activeNote = n;
  renderList();

  document.getElementById('noNoteMsg').style.display = 'none';
  const ec = document.getElementById('editorContent');
  ec.style.display = 'flex';
  ec.classList.add('anim-fade-in');

  document.getElementById('noteTitle').value = n.title;
  document.getElementById('noteBody').value  = n.content;
  document.getElementById('noteCat').value   = n.category;
  document.getElementById('noteTimestamp').textContent = `Last updated ${timeAgo(n.updatedAt)}`;
  document.getElementById('ip-cat').textContent     = n.category;
  document.getElementById('ip-created').textContent = formatDate(n.createdAt);
  document.getElementById('ip-updated').textContent = formatDate(n.updatedAt);
  document.getElementById('ip-length').textContent  = countWords(n.content) + ' words';
  document.getElementById('pinBtn').textContent     = n.pinned ? '📌 Unpin note' : '📌 Pin note';
}

function countWords(s) { return s.split(/\s+/).filter(Boolean).length; }

// ── Auto-save ─────────────────────────────────────────────────
['noteTitle','noteBody','noteCat'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(autoSave, 1200);
    if (id === 'noteBody') {
      document.getElementById('ip-length').textContent = countWords(document.getElementById('noteBody').value) + ' words';
    }
  });
});

function autoSave() {
  if (!activeNote) return;
  const data = {
    title:    document.getElementById('noteTitle').value.trim() || 'Untitled',
    content:  document.getElementById('noteBody').value,
    category: document.getElementById('noteCat').value,
  };
  Notes.update(activeNote.id, data);
  activeNote = Notes.get(activeNote.id);
  document.getElementById('noteTimestamp').textContent = `Last updated just now`;
  document.getElementById('ip-updated').textContent = 'just now';
  const ind = document.getElementById('saveIndicator');
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 2000);
  renderList();
  renderCats();
}

document.getElementById('saveNoteBtn').addEventListener('click', autoSave);

// ── New note ──────────────────────────────────────────────────
function createNote() {
  const n = Notes.create({ title:'Untitled Note', content:'', category:'General' });
  activeCategory = 'All Notes';
  renderCats(); renderList();
  openNote(n);
  setTimeout(() => { document.getElementById('noteTitle').focus(); document.getElementById('noteTitle').select(); }, 100);
}
document.getElementById('newNoteBtn').addEventListener('click', createNote);
document.getElementById('noNoteBtn').addEventListener('click', createNote);

// ── Delete note ───────────────────────────────────────────────
document.getElementById('deleteNoteBtn').addEventListener('click', () => {
  if (!activeNote) return;
  if (!confirm(`Delete "${activeNote.title}"?`)) return;
  Notes.delete(activeNote.id);
  activeNote = null;
  document.getElementById('noNoteMsg').style.display = '';
  document.getElementById('editorContent').style.display = 'none';
  renderCats(); renderList();
});

// ── Pin ───────────────────────────────────────────────────────
document.getElementById('pinBtn').addEventListener('click', () => {
  if (!activeNote) return;
  Notes.update(activeNote.id, { pinned: !activeNote.pinned });
  activeNote = Notes.get(activeNote.id);
  document.getElementById('pinBtn').textContent = activeNote.pinned ? '📌 Unpin note' : '📌 Pin note';
  renderList();
});

// ── Search ────────────────────────────────────────────────────
document.getElementById('noteSearch').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderList();
});

// ── Toolbar helpers ───────────────────────────────────────────
window.insert = function(before, after='') {
  const ta = document.getElementById('noteBody');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.substring(s, e);
  const rep = before + (sel || 'text') + after;
  ta.setRangeText(rep, s, e, 'select');
  ta.focus();
  clearTimeout(saveTimer); saveTimer = setTimeout(autoSave, 1200);
};
window.insertLine = function(prefix) {
  const ta = document.getElementById('noteBody');
  const s = ta.selectionStart;
  const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1;
  ta.setRangeText('\n' + prefix, s, s, 'end');
  ta.focus();
  clearTimeout(saveTimer); saveTimer = setTimeout(autoSave, 1200);
};
window.wrapCode = function() {
  const ta = document.getElementById('noteBody');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.substring(s, e);
  const rep = '```\n' + (sel||'code here') + '\n```';
  ta.setRangeText(rep, s, e, 'select');
  ta.focus();
};

// ── Init ──────────────────────────────────────────────────────
renderCats();
renderList();
// Auto-open first note
const first = Notes.all()[0];
if (first) openNote(first);
</script>
</body>
